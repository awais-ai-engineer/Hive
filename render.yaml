# Render Blueprint: the Hive API (FastAPI + Socket.IO) and its Redis.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: hive-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/server
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hive-redis
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GAME_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: hive-media
      - key: MAX_VIDEO_MB
        value: "50"

  - type: keyvalue
    name: hive-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
