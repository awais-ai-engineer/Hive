# Render Blueprint: the Hive API (FastAPI + Socket.IO), the website (Next.js) and Redis.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: hive-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/server
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run alembic upgrade head
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hive-redis
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GAME_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: hive-media
      - key: MAX_VIDEO_MB
        value: "50"

  - type: web
    name: hive-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hive/shared build && pnpm --filter @hive/web build
    startCommand: cd apps/web && pnpm exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://hive-api-xxxx.onrender.com (no trailing slash).
      # NEXT_PUBLIC_* values are baked in at build time: redeploy the site after changing it.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: API_PROXY_TARGET
        sync: false
      - key: NEXT_PUBLIC_AUTH_PROXY
        value: "1"
      - key: NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED
        sync: false

  - type: keyvalue
    name: hive-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
