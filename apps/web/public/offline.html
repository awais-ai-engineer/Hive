<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d4aff">
  <title>Hive is offline</title>
  <style>
    :root { --bg: #f6f5fb; --fg: #1b1530; --muted: #5d5675; --brand: #6d4aff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d0b17; --fg: #f1eefc; --muted: #a9a2c4; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 16px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    button { border: 0; border-radius: 12px; padding: 10px 20px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>You&rsquo;re offline</h1>
    <p>Hive needs an internet connection to load your messages. Check your connection and try again. Nothing you sent is lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
