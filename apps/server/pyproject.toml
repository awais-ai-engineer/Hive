[project]
name = "hive-server"
version = "0.1.0"
description = "Hive API and realtime server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-ulid>=3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-socketio[asyncio-client]>=5.18.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# Migrations are generated by Alembic and must not be edited after they are applied.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
