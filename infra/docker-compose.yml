name: hive

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # File storage (S3-compatible) gets added with uploads; production uses Cloudflare R2.

  moderation:
    build: ../services/moderation
    ports: ["8000:8000"]

volumes:
  pgdata:
