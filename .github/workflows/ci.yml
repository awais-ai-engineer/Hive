name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --frozen
        working-directory: apps/server
      - run: uv run ruff check .
        working-directory: apps/server
      - run: uv run pytest -q
        working-directory: apps/server
      - run: uv run alembic upgrade head && uv run alembic check
        working-directory: apps/server
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hive/shared build
      - run: pnpm --filter @hive/web exec playwright install --with-deps chromium
      - run: uv run python -m app.seed
        working-directory: apps/server
      - name: Browser accessibility and preference checks
        run: |
          (cd apps/server && uv run uvicorn app.main:app --port 4000 > /tmp/hive-api.log 2>&1) &
          pnpm --filter @hive/web dev > /tmp/hive-web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:3000/login > /dev/null; then break; fi
            sleep 2
          done
          pnpm --filter @hive/web test:ui
      - name: Browser failure logs
        if: failure()
        run: cat /tmp/hive-api.log /tmp/hive-web.log || true
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hive/shared build
      - run: pnpm --filter @hive/shared test:theme
      - run: pnpm --filter @hive/web lint:tokens
      - run: pnpm typecheck
      - run: pnpm build
